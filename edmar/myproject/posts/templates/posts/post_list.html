
{% extends 'layout.html'%}

{% block title %}
    Post list
{% endblock %}

{% block content %}
   <section>
      <h1 class="post-list-title">Post List</h1> <!-- Title of the post list -->
      <div class="post-container"> <!-- Added container -->
          {% for post in post %}
            <article class="post">
                <h2 class="post-title">{{ post.title }}</h2> <!-- Title of the each post -->
                <p class="post-date">{{ post.date }}</p> <!-- Date of each post -->
                <p class="post-body">{{ post.body }}</p> <!-- Body of each post -->
            </article>
          {% endfor %}     
     </div>       
    </section> <!-- <p>Check out my <a herf="/"<Home</a> page.</p> -->
{% endblock %}
